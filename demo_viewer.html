<!doctype html>
<html lang="en" data-inference="off">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:,">
<title>Piano to MIDI · TorchPitch</title>
<style>
  :root { color-scheme: light; color: #20231f; background: white; font-family: Georgia, "Times New Roman", serif; }
  * { box-sizing: border-box; }
  body { margin: 0; }
  main { width: min(100% - 44px, 1380px); margin: clamp(32px, 7vh, 64px) auto; }
  h1 { margin: 0; color: #151814; font-size: clamp(44px, 7vw, 66px); line-height: 1.05; font-weight: 500; letter-spacing: -.055em; }
  .intro { margin: 15px 0 29px; font-size: clamp(17px, 2.5vw, 20px); line-height: 1.5; }
  .sources { display: flex; align-items: center; flex-wrap: wrap; gap: 8px 20px; }
  select { width: min(100%, 23rem); min-height: 40px; padding: 7px 10px; border: 1px solid #b9beb9; border-radius: 5px; color: inherit; background: white; font: inherit; }
  a, button { color: #315632; text-underline-offset: 4px; }
  .sources a, button { padding: 10px 0; color: inherit; font: inherit; background: none; border: 0; text-decoration: underline; cursor: pointer; }
  :focus-visible { outline: 2px solid #427043; outline-offset: 4px; }
  .comparison {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    column-gap: clamp(14px, 3vw, 36px);
    margin-top: 32px;
  }
  .comparison section { display: grid; grid-template-rows: subgrid; grid-row: 1 / span 4; min-width: 0; }
  #original-section { grid-column: 1; }
  #prediction-section { grid-column: 2; }
  .comparison .midi-view { display: grid; grid-template-rows: subgrid; grid-row: span 2; }
  .comparison .midi-heading { align-self: end; }

  h2 { margin: 0 0 10px; font-size: 21px; font-weight: normal; }
  .caption { margin: -4px 0 12px; color: #536159; font: 14px/1.4 system-ui, sans-serif; }
  .comparison {
    --player-bg: #f2f6f2; --plot-bg: #f6f8f5; --wave-peak: #a8c6b2;
    --wave-body: #3b7156; --wave-mid: #68947d; --notes: #286046;
    --control: #254a36; --cursor: #1d382b;
  }
  [data-source].is-playing {
    --player-bg: #dbeafe; --plot-bg: #eaf3ff; --wave-peak: #8bb8ee;
    --wave-body: #235fa7; --wave-mid: #3778be; --notes: #215fa9;
    --control: #144c88; --cursor: #123f75;
  }
  .is-playing :is(.clock, h2, h3, a) { color: var(--control); }
  .wave-player { background: var(--player-bg); border-radius: 6px; padding: 6px 8px 4px; }
  .transport, .midi-heading { display: flex; align-items: center; gap: 10px; }
  .transport { justify-content: space-between; }
  .transport button, .audition { display: inline-flex; align-items: center; gap: 7px; border: 0; color: var(--control); background: none; font: 600 13px system-ui, sans-serif; min-height: 34px; padding: 3px 7px; text-decoration: none; }
  [data-play]::before { content: ""; display: inline-block; width: 0; height: 0; border-block: 5px solid transparent; border-left: 8px solid currentColor; }
  [data-play][aria-pressed="true"]::before { width: 3px; height: 10px; border: 0; border-inline: 3px solid currentColor; }
  .clock { margin-right: 6px; color: #344c3d; font: 12px ui-monospace, monospace; font-variant-numeric: tabular-nums; }
  .midi-view { margin: 9px 8px 0; }
  .midi-heading { flex-wrap: wrap; gap: 4px 12px; min-height: 32px; font: 12px system-ui, sans-serif; }
  .midi-heading h3 { font: 600 13px system-ui, sans-serif; margin: 0 auto 0 0; }
  .midi-heading a { padding-block: 6px; }
  .midi-heading .audition { min-height: 30px; font-size: 12px; }
  .plot { position: relative; }
  .plot canvas { display: block; width: 100%; height: clamp(74px, 10vh, 98px); }
  .roll canvas { height: clamp(150px, 21vh, 212px); }
  .scrub { position: absolute; inset: 0 5px 0 29px; }
  .roll .scrub { bottom: 17px; }
  .scrub::after { content: ""; position: absolute; left: var(--progress, 0%); top: 0; bottom: 0; border-left: 1.5px solid var(--cursor); pointer-events: none; }
  .scrub input { position: absolute; inset: 0; margin: 0; width: 100%; height: 100%; opacity: 0; cursor: crosshair; }
  .scrub:focus-within { outline: 2px solid #427043; outline-offset: 2px; }
  footer { display: flex; justify-content: space-between; flex-wrap: wrap; gap: 12px; margin-top: 28px; border-top: 1px solid #d9dcd7; padding-top: 17px; }
  @media (max-width: 620px) {
    main { width: calc(100% - 24px); }
    .comparison { column-gap: 12px; }
    .transport { flex-direction: column; align-items: start; gap: 0; }
    .wave-player { padding-inline: 3px; }
    .clock { padding: 2px 5px; }
    .midi-view { margin-inline: 3px; }
    .midi-heading { gap: 2px 7px; padding-bottom: 4px; }
    .midi-heading h3 { flex-basis: 100%; }
    .caption { font-size: 13px; }
  }
  @media (max-width: 460px) {
    .transport button { font-size: 12px; }
    .clock { margin-bottom: 4px; }
    h2 { font-size: 19px; }
  }
  #status { font: 14px/1.5 system-ui, sans-serif; overflow-wrap: anywhere; }
  #status:empty { display: none; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<main>
  <h1>Piano to MIDI</h1>
  <p class="intro">Listen to an example or transcribe a piano recording.</p>
  <div class="sources">
    <select id="examples" aria-label="Choose a piano example"></select>
    <a id="live" href="http://127.0.0.1:8766/">Open live demo</a>
    <button id="choose" type="button" hidden>Open WAV file</button>
    <input type="file" id="file" accept=".wav,audio/wav,audio/x-wav" hidden>
  </div>
  <p id="status" role="status"></p>
  <div class="comparison">
  <section id="original-section" aria-labelledby="original-label">
    <header><h2 id="original-label">Original recording</h2></header>
    <audio id="original" preload="metadata" hidden></audio>
    <div class="wave-player" data-source="original">
      <div class="transport">
        <button data-play="original" type="button">Play</button>
        <span class="clock">0:00 / 0:00</span>
      </div>
      <div class="plot" data-track="original" data-view="wave">
        <canvas role="img" aria-label="Original recording waveform"></canvas>
        <div class="scrub"><input type="range" min="0" step="0.01" value="0" aria-label="Seek in original recording"></div>
      </div>
    </div>
    <div class="midi-view" id="original-midi" data-source="reference">
      <div class="midi-heading"><h3>Ground-truth MIDI</h3><button class="audition" data-play="reference" type="button">Play MIDI</button>
        <a id="original-download" download aria-label="Download ground-truth midi">Download MIDI</a>
      </div>
      <div class="plot roll" data-track="original" data-view="roll">
        <canvas role="img" aria-label="Ground-truth MIDI piano roll"></canvas>
        <div class="scrub"><input type="range" min="0" step="0.01" value="0" aria-label="Seek in ground-truth midi piano roll"></div>
      </div>
    </div>
  </section>
  <section data-source="prediction" id="prediction-section" aria-labelledby="prediction-label">
    <header><h2 id="prediction-label">Model transcription</h2><p class="caption">Synthesized from predicted notes.</p></header>
    <audio id="prediction" preload="metadata" hidden></audio>
    <div class="wave-player">
      <div class="transport">
        <button data-play="prediction" type="button">Play</button>
        <span class="clock">0:00 / 0:00</span>
      </div>
      <div class="plot" data-track="prediction" data-view="wave">
        <canvas role="img" aria-label="Model transcription waveform"></canvas>
        <div class="scrub"><input type="range" min="0" step="0.01" value="0" aria-label="Seek in model transcription"></div>
      </div>
    </div>
    <div class="midi-view" id="prediction-midi">
      <div class="midi-heading"><h3>Predicted MIDI</h3>
        <a id="prediction-download" download aria-label="Download predicted midi">Download MIDI</a>
      </div>
      <div class="plot roll" data-track="prediction" data-view="roll">
        <canvas role="img" aria-label="Predicted MIDI piano roll"></canvas>
        <div class="scrub"><input type="range" min="0" step="0.01" value="0" aria-label="Seek in predicted midi piano roll"></div>
      </div>
    </div>
  </section>
  </div>
  <audio id="reference" preload="metadata" hidden></audio>
  <footer><a href="experiment.html">About the experiment</a></footer>
  <noscript>Enable JavaScript to listen to the examples.</noscript>
</main>
<script type="application/json" id="demo-data">__DEMO_DATA__</script>
<script src="timeline.js"></script>
<script>
  const el = id => document.getElementById(id);
  const {clips} = JSON.parse(el("demo-data").textContent);
  const examples = el("examples");
  const original = el("original");
  const prediction = el("prediction");
  const timeline = new PianoTimeline();
  const uploaded = new Option("Your recording", "");
  uploaded.disabled = true;
  let request;
  let originalURL;

  for (const clip of clips) {
    const passage = clip.id === "endings" ? "Note endings" : clip.label;
    const option = new Option(clip.composer.split(" ").pop() + " · " + passage, clip.id);
    option.title = clip.title;
    examples.add(option);
  }
  function clearSelection() {
    request?.abort();
    timeline.reset();
    el("prediction-section").hidden = true;
    el("original-midi").hidden = true;
    if (originalURL) URL.revokeObjectURL(originalURL);
    originalURL = null;
    uploaded.remove();
    el("status").textContent = "";
  }
  function showExample() {
    const clip = clips.find(item => item.id === location.hash.slice(1)) || clips[0];
    clearSelection();
    examples.value = clip.id;
    original.src = clip.assets["original.wav"];
    prediction.src = clip.assets["prediction.wav"];
    el("prediction-download").href = clip.assets["prediction.mid"];
    el("prediction-download").download = clip.id + ".mid";
    const reference = clip.assets["reference.wav"];
    if (reference) {
      el("reference").src = reference;
      el("original-download").href = clip.assets["reference.mid"];
      el("original-download").download = clip.id + "-reference.mid";
      el("original-midi").hidden = false;
    }
    el("prediction-section").hidden = false;
    timeline.show(clip.tracks);
    el("live").hash = clip.id;
  }
  examples.addEventListener("change", () => {
    if (location.hash === "#" + examples.value) showExample();
    else location.hash = examples.value;
  });
  window.addEventListener("hashchange", showExample);

  async function transcribe(file) {
    clearSelection();
    history.replaceState(null, "", location.pathname + location.search);
    uploaded.text = file.name;
    examples.add(uploaded);
    uploaded.selected = true;
    originalURL = URL.createObjectURL(file);
    original.src = originalURL;

    const controller = new AbortController();
    request = controller;
    el("status").textContent = "Transcribing…";
    try {
      if (file.size > 32 * 1024 * 1024) throw new Error("Choose a WAV file under 32 MB.");
      const response = await fetch("/transcribe", {
        method: "POST", headers: {"Content-Type": "audio/wav"}, body: file, signal: controller.signal
      });
      const result = await response.json();
      if (controller.signal.aborted) return;
      if (!response.ok) throw new Error(result.error || "Transcription failed. Try another recording.");
      prediction.src = result.audio;
      el("prediction-download").href = result.midi;
      el("prediction-download").download = file.name.replace(/\.wav$/i, "") + ".mid";
      el("status").textContent = result.notes ? "" : "The model detected no notes in this recording.";
      el("prediction-section").hidden = false;
      timeline.show({original: {...result.visualization, events: []}, prediction: result.prediction_visualization});
    } catch (error) {
      if (!controller.signal.aborted) el("status").textContent = error.message;
    }
  }
  if (document.documentElement.dataset.inference === "on") {
    el("live").hidden = true;
    el("choose").hidden = false;
    el("choose").title = "Piano WAV, up to 60 seconds";
    el("choose").onclick = () => el("file").click();
    el("file").onchange = () => {
      const file = el("file").files[0];
      el("file").value = "";
      if (file) transcribe(file);
    };
  }
  showExample();
</script>
</body>
</html>
